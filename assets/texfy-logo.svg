      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>
  <!-- Ícone Têxtil Estilizado (Carretel / Fibras Entrelaçadas 'T') -->
