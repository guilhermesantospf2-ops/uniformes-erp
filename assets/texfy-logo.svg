<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 76" width="340" height="76">
  <defs>
    <linearGradient id="ribbonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="ribbonEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="ribbonDeep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#032b35" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0d9488" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Isotipo: Monograma T em Fitas Têxteis Diagonais Entrelaçadas -->
  <g transform="translate(10, 8)" filter="url(#softGlow)">
    <!-- Barra Superior Esquerda do T -->
    <path d="M 6 18 L 22 6 L 34 6 L 20 18 Z" fill="url(#ribbonCyan)" />
    <!-- Barra Superior Direita do T -->
    <path d="M 28 6 L 54 6 L 44 18 L 22 18 Z" fill="url(#ribbonEmerald)" />
    <!-- Fita Diagonal 1 (Descendente Esquerda) -->
    <path d="M 20 18 L 32 18 L 18 42 L 8 42 Z" fill="url(#ribbonCyan)" />
    <!-- Fita Diagonal 2 (Descendente Direita / Entrelaçamento) -->
    <path d="M 32 18 L 44 18 L 26 48 L 16 48 Z" fill="url(#ribbonEmerald)" />
    <!-- Dobra Inferior de Trama (Pontal Têxtil) -->
    <path d="M 16 48 L 26 48 L 21 58 Z" fill="url(#ribbonDeep)" />
    <!-- Ponto de Trama de Alta Precisão -->
    <circle cx="27" cy="27" r="2.5" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- Wordmark: TEXFY -->
  <text x="82" y="45" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="33" font-weight="900" fill="#032b35" letter-spacing="-0.8px">TEXFY</text>
  
  <!-- Subtítulo: ERP TÊXTIL -->
  <text x="84" y="62" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="800" fill="#0d9488" letter-spacing="3.8px">ERP TÊXTIL</text>
  
  <!-- Badge PRO -->
  <rect x="232" y="24" width="38" height="18" rx="5" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.2" />
  <text x="251" y="36.5" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="900" fill="#0d9488" text-anchor="middle">PRO</text>
</svg>
