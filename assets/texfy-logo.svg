  <!-- Subtítulo ERP TÊXTIL -->
  <text x="88" y="64" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#0d9488" letter-spacing="3.5">ERP TÊXTIL</text>
