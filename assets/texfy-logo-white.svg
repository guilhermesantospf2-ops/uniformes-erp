<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 76" width="340" height="76">
  <defs>
    <linearGradient id="ribbonWhiteCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
    <linearGradient id="ribbonWhiteEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="whiteGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#2dd4bf" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Isotipo: Monograma T em Fitas Têxteis (Versão White/Dark Mode) -->
  <g transform="translate(10, 8)" filter="url(#whiteGlow)">
    <path d="M 6 18 L 22 6 L 34 6 L 20 18 Z" fill="url(#ribbonWhiteCyan)" />
    <path d="M 28 6 L 54 6 L 44 18 L 22 18 Z" fill="url(#ribbonWhiteEmerald)" />
    <path d="M 20 18 L 32 18 L 18 42 L 8 42 Z" fill="url(#ribbonWhiteCyan)" />
    <path d="M 32 18 L 44 18 L 26 48 L 16 48 Z" fill="url(#ribbonWhiteEmerald)" />
    <path d="M 16 48 L 26 48 L 21 58 Z" fill="#0ea5e9" />
    <circle cx="27" cy="27" r="2.5" fill="#ffffff" />
  </g>

  <!-- Wordmark: TEXFY (Pure White) -->
  <text x="82" y="45" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="33" font-weight="900" fill="#ffffff" letter-spacing="-0.8px">TEXFY</text>
  
  <!-- Subtítulo: ERP TÊXTIL (Light Cyan) -->
  <text x="84" y="62" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="800" fill="#5eead4" letter-spacing="3.8px">ERP TÊXTIL</text>
  
  <!-- Badge PRO -->
  <rect x="232" y="24" width="38" height="18" rx="5" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.3)" stroke-width="1.2" />
  <text x="251" y="36.5" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="900" fill="#ffffff" text-anchor="middle">PRO</text>
</svg>
